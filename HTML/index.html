<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos Atmosferico "EL TATA"</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <script src="../JS/turnos.js"></script>
    <script src="../JS/app.js"></script>
    <div class="main-container">
        <div class="left-panel">
            <div class="logo-container">
                <img src="../images/logoCirculo.png" alt="Logo Atmosferico EL TATA">
                <h1 class="brand-name">Atmosferico "EL TATA"</h1>
                <p class="brand-tagline">Sistema de Turnos Online</p>
            </div>
        </div>
        <div class="right-panel">
            <button class="btn-admin" onclick="document.getElementById('modal-login').style.display='flex'">Administración</button>
            <div class="glass-card">
                <h2>Bienvenido</h2>
                <p class="subtitle">Selecciona una opción para continuar</p>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="window.location.href='request.html'">Solicitar Turno</button>
                    <button class="btn" onclick="window.location.href='consult.html'">Consultar Turnos</button>
                </div>
                <div class="copyright">
                    <h6>&copy; 2026 <a href="https://juanboyero-dev.netlify.app/" target="_blank">JuanBoyeroDev</a>. Todos los derechos reservados.</h6>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Login Admin -->
    <div id="modal-login" class="modal-overlay">
        <div class="modal-card glass-card">
            <h2>Acceso Administración</h2>
            <div class="form-group">
                <input type="text" id="login-usuario" required>
                <label for="login-usuario">Usuario:</label>
            </div>
            <div class="form-group">
                <input type="password" id="login-password" required>
                <label for="login-password">Contraseña:</label>
            </div>
            <button class="btn-submit" id="btn-login">Ingresar</button>
            <button class="btn" style="margin-top: 10px;" onclick="document.getElementById('modal-login').style.display='none'">Cancelar</button>
        </div>
    </div>

    <script>
    document.getElementById("btn-login").addEventListener("click", function() {
        var usuario = document.getElementById("login-usuario").value;
        var password = document.getElementById("login-password").value;
        if (usuario === "Admin" && password === "Admin") {
            sessionStorage.setItem("adminAuth", "true");
            window.location.href = "admin.html";
        } else {
            alert("Usuario o contraseña incorrectos");
        }
    });
    </script>
</body>
</html>
