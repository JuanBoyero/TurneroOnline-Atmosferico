<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Turnos</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <div class="main-container">
        <div class="left-panel">
            <div class="logo-container">
                <img src="../images/logoCirculo.png" alt="Logo Atmosferico EL TATA">
                <h1 class="brand-name">Atmosferico "EL TATA"</h1>
                <p class="brand-tagline">Sistema de Turnos Online</p>
            </div>
        </div>
        <div class="right-panel">
            <div class="glass-card">
                <h2>Consultar Turnos</h2>
                <p class="subtitle">Ingresa tu DNI y localidad para consultar tus turnos</p>

                <div class="form-group">
                    <input type="number" id="dni" name="dni" required>
                    <label for="dni">Número de DNI:</label>
                </div>

                <div class="form-group">
                    <select id="localidad" name="localidad" required>
                        <option value="" disabled selected>Seleccionar Localidad</option>
                        <option value="Mattaldi">Mattaldi</option>
                        <option value="Jovita">Jovita</option>
                    </select>
                    <label for="localidad">Localidad:</label>
                </div>

                <button class="btn-submit" id="btn-consultar">Consultar</button>

                <div id="resultados" style="display: none; margin-top: 25px;">
                    <div class="resultado-card" id="resultado-contenido"></div>
                </div>

                <div class="btn-home">
                    <button class="btn" onclick="window.location.href='index.html'">Volver al Inicio</button>
                </div>
                <div class="copyright">
                    <h6>&copy; 2026 <a href="https://juanboyero-dev.netlify.app/" target="_blank">JuanBoyeroDev</a>. Todos los derechos reservados.</h6>
                </div>
            </div>
        </div>
    </div>
    <script src="../JS/consult.js"></script>
</body>
</html>
