<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Turno</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <div class="main-container">
        <div class="left-panel">
            <div class="logo-container">
                <img src="../images/logoCirculo.png" alt="Logo Atmosferico EL TATA">
                <h1 class="brand-name">Atmosferico "EL TATA"</h1>
                <p class="brand-tagline">Sistema de Turnos Online</p>
            </div>
        </div>
        <div class="right-panel">
            <div class="glass-card">
                <h2>Solicitar Turno</h2>
                <p class="subtitle">Completa el formulario para solicitar tu turno</p>
                <form action="solicitar_turno.php" method="post">
                    <div class="form-group">
                        <input type="text"  id="nombre" name="nombre" required minlength="3">
                        <label for="nombre">Nombre:</label>
                    </div>

                    <div class="form-group">
                        <input type="number"  id="dni" name="dni" required>
                        <label for="dni">DNI:</label>
                    </div>

                    <div class="form-group">
                        <input type="text"  id="direccion" name="direccion" required>
                        <label for="direccion">Dirección:</label>
                    </div>

                    <div class="form-group">
                        <select id="localidad" name="localidad" required>
                            <option value="" disabled selected>Seleccionar Localidad</option>
                            <option value="Mattaldi">Mattaldi</option>
                            <option value="Jovita">Jovita</option>
                        </select>
                        <label for="localidad">Localidad:</label>
                    </div>

                    <div class="form-group">
                        <input type="text"  id="telefono" name="telefono" required>
                        <label for="telefono">Teléfono:</label>

                    <button type="submit" class="btn-submit">Solicitar Turno</button>
                </form>
                <div class="btn-home">
                    <button class="btn" onclick="window.location.href='index.html'">Cancelar</button>
                </div>
                <div class="copyright">
                    <h6>&copy; 2026 <a href="https://juanboyero-dev.netlify.app/" target="_blank">JuanBoyeroDev</a> . Todos los derechos reservados.</h6>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
